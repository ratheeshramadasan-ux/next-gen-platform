services:

  db:
    image: postgres:15-alpine
    container_name: next-gen-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratheesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sid6554*}
      POSTGRES_DB: ${POSTGRES_DB:-NextGen}
    ports:
      - "5433:5432"
    volumes:
      - nextgen_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratheesh -d NextGen"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: next-gen-redis
    ports:
      - "6379:6379"
    restart: always

  mailhog:
    image: mailhog/mailhog
    container_name: next-gen-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  auth-service:
    build: ../services/identity-service
    container_name: next-gen-auth
    environment:
      DATABASE_URL: postgresql://ratheesh:Sid6554*@db:5432/NextGen
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_123}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  api-gateway:
    build: ../apps/api-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ratheesh:Sid6554*@db:5432/NextGen
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started

  control-plane:
    build: ../control
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://ratheesh:Sid6554*@db:5432/NextGen
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ../services/worker
    environment:
      DATABASE_URL: postgresql://ratheesh:Sid6554*@db:5432/NextGen
    depends_on:
      db:
        condition: service_healthy

volumes:
  nextgen_data:
