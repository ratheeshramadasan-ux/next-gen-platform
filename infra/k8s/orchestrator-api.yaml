apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator-api
  template:
    metadata:
      labels:
        app: orchestrator-api
    spec:
      containers:
        - name: orchestrator-api
          image: rpa/orchestrator-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-api
spec:
  selector:
    app: orchestrator-api
  ports:
    - port: 3001
      targetPort: 3001

