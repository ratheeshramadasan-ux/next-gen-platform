services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nextgen_platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextgen_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator-api:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nextgen_platform
      OPENAI_MODEL: gpt-4.1-mini
      NODE_PATH: /app/apps/orchestrator-api/node_modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web-studio:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install --filter @rpa/web-studio... --no-frozen-lockfile && pnpm --filter @rpa/web-studio dev"
    environment:
      ORCHESTRATOR_API_URL: http://orchestrator-api:3001/run-intent
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator-api

volumes:
  postgres_data:
